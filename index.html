<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="assets/imgs/favicon.ico">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<title>Pink pastures 😊 ♡Oli♡</title>
</head>
<body>
<main>
	<header class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-start" >
		<marquee id="marqueeText">Hello = 3 ♡</marquee>
	</header>
	<article class="d-flex justify-content-center align-items-center vh-100">	
		<div class="card mycard-theme" style="width: 18rem;">
			<img src="assets/imgs/gamingpc.jpg" class="card-img-top" alt="old pc">
			<div class="card-body">
				<h5 id="itemName" class="card-title">Gaming PC</h5>
				<p class="card-text">Price: $<span id="itemPrice">400000</span></p>
				<p class="card-text">Stock: <span id="itemStock">3</span></p>
				<div id="stockAvailable">
					<p>Quantity:
						<input id="itemQuantity" class="quantity" type="number" value=0 min="0" onchange="updatePrice()"></input>
						<a href="#" onclick="changeQuantity(1)" class="btn btn-primary">+</a>
						<a href="#" onclick="changeQuantity(-1)" class="btn btn-primary">-</a>
					</p>
					<p class="card-text">Total: $<span id="totalPrice">0</span></p>
					<div class="d-flex justify-content-end">
						<a id="submitPurchase" href="#" onclick="processSale()" class="disabled btn btn-primary">Submit</a>
					</div>
				</div>
			</div>
		</div>
	</article>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
