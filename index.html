<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="assets/imgs/favicon.ico">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<title>Pink pastures 😊 ♡Oli♡</title>
</head>
<body>
<div class="d-flex justify-content-center align-items-center min-vh-100">
	<header class="position-absolute top-0 start-0 w-100 d-flex align-items-start" >
		<marquee class="marqueeText">Hello = 3 ♡</marquee>
	</header>
	<nav class="d-flex justify-content-center align-items-start vh-100 pt-5">
		<a href="#" class="navLink" onclick="say_hi()"">FAQ</a>&emsp;<a href="#" class="navLink" onclick="say_hi()">Contact me</a>
	</nav>
	<aside class="position-fixed top-0 start-0 vh-100 p-4 custom-floating-panel" style="width: 14rem;">
    <div id="sideBar" class="card h-100 shadow mycard-theme">
      <header class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span>About me</span>
      </header>
      <section class="card-body overflow-auto">
        <h6>⋆｡‧˚ʚ🍓ɞ˚‧｡⋆ Oli's shop ˚˖𓍢🌷✧˚.🎀⋆</h6>
        <p class="small text-muted">This is just a bootstrap test, mimicking a shop front, and using semantic HTML5 tags.  Welcome! ^,=,^</p>
        <button class="btn btn-sm btn-outline-primary w-100 mb-2" onclick="say_hi()">(づ｡◕‿‿◕｡)づ Say hi</button>
        <button class="btn btn-sm btn-outline-secondary w-100">Coming soon!</button>
      </section>
    </div>
  </aside>

	<main id="mainSection" class="d-flex justify-content-center align-items-center card mycard-theme" style="width: 22rem;">
	<p id="mainText">♡ Online shop ♡</p>
		<article class="d-flex justify-content-center align-items-center card mycard-theme" style="width: 18rem;">
			<img src="assets/imgs/gamingpc.jpg" class="card-img-top" alt="old pc">
			<div class="card-body">
				<h5 id="itemName" class="card-title">Gaming PC</h5>
				<p class="card-text">Price: $<span id="itemPrice">400000</span></p>
				<p class="card-text">Stock: <span id="itemStock">3</span></p>
				<div id="stockAvailable">
					<p>Quantity:
						<input id="itemQuantity" class="quantity" type="number" value=0 min="0" onchange="updatePrice()"></input>
						<a href="#" onclick="changeQuantity(1)" class="btn btn-primary">+</a>
						<a href="#" onclick="changeQuantity(-1)" class="btn btn-primary">-</a>
					</p>
					<p class="card-text">Total: $<span id="totalPrice">0</span></p>
					<div class="d-flex justify-content-end">
						<a id="submitPurchase" href="#" onclick="processSale()" class="disabled btn btn-primary">Submit</a>
					</div>
				</div>
			</div>
		</article>
	</main>
	<footer class="position-absolute d-flex flex-column bottom-0 start-0 w-100 align-items-start" >
		<marquee class="marqueeText">Thank you for visiting! = 3 ♡</marquee>
	</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
